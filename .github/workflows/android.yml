name: android-build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Decode Signing Keystore
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Assemble Debug & Release APKs
        env:
          SIGNING_KEYSTORE_PATH: ${{ secrets.SIGNING_KEYSTORE != '' && format('{0}/keystore.jks', github.workspace) || '' }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --no-daemon --build-cache --parallel --stacktrace 2>&1 | tee build_output.log

      - name: Push Build Failure Log
        if: failure()
        run: |
          git config user.name "CI Bot"
          git checkout -B ci-failure-log
          cp build_output.log ci_build_error.txt
          git add -f ci_build_error.txt
          git commit -m "CI failure log"
          git push -f origin ci-failure-log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
