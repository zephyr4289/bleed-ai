name: android-build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --build-cache --parallel --stacktrace 2>&1 | tee build_output.log

      - name: Report Build Failure
        if: failure()
        run: |
          echo "### Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(e: |error:|FAILED|FAILURE:|Compilation error)" -C 5 build_output.log | head -n 120 >> $GITHUB_STEP_SUMMARY || tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
