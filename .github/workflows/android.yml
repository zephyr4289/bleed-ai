name: android-build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --build-cache --parallel --stacktrace 2>&1 | tee build_output.log

      - name: Push Build Failure Log
        if: failure()
        run: |
          git config user.name "CI Bot"
          git config user.email "bot@example.com"
          git checkout -B ci-failure-log
          tail -n 250 build_output.log > ci_build_error.txt
          git add -f ci_build_error.txt
          git commit -m "CI failure: $(grep -E 'e: ' build_output.log | head -n 2 || echo 'build failed')"
          git push -f origin ci-failure-log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
